<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TypeFlow - 中英打字练习</title>
<style>
:root {
  --bg: #f5f5f7;
  --card-bg: #ffffff;
  --text: #1d1d1f;
  --text-secondary: #86868b;
  --text-tertiary: #aeaeb2;
  --border: #e5e5ea;
  --primary: #007AFF;
  --primary-bg: rgba(0,122,255,0.1);
  --correct: #34C759;
  --error: #FF3B30;
  --shadow: 0 4px 20px rgba(0,0,0,0.05);
  --shadow-lg: 0 20px 60px rgba(0,0,0,0.12);
  --radius: 20px;
  --radius-sm: 12px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --overlay-bg: rgba(255,255,255,0.7);
}
.dark {
  --bg: #1c1c1e;
  --card-bg: #2c2c2e;
  --text: #f5f5f7;
  --text-secondary: #98989d;
  --text-tertiary: #636366;
  --border: #38383a;
  --primary-bg: rgba(0,122,255,0.2);
  --shadow: 0 4px 20px rgba(0,0,0,0.3);
  --shadow-lg: 0 20px 60px rgba(0,0,0,0.5);
  --overlay-bg: rgba(28,28,30,0.7);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{
  font-family:var(--font-stack);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:20px;
  transition:background var(--transition),color var(--transition);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.app-container{width:100%;max-width:800px;display:flex;flex-direction:column;gap:16px}
.header{text-align:center;padding:10px 0 0}
.logo{font-size:2rem;font-weight:700;letter-spacing:-0.5px;color:var(--text);transition:color var(--transition)}
.logo-dot{color:var(--primary)}
.subtitle{font-size:0.9rem;color:var(--text-secondary);margin-top:2px;font-weight:400;transition:color var(--transition)}
.header-top{display:flex;align-items:center;justify-content:center;gap:16px;position:relative}
.dark-toggle{
  position:absolute;right:0;
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:50%;width:40px;height:40px;font-size:1.2rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all var(--transition);box-shadow:var(--shadow);
}
.dark-toggle:hover{transform:scale(1.05)}
.lang-toggle{
  display:flex;background:var(--card-bg);border-radius:12px;padding:4px;
  box-shadow:var(--shadow);transition:background var(--transition),box-shadow var(--transition);
  user-select:none;max-width:200px;margin:0 auto;
}
.lang-item{
  flex:1;text-align:center;padding:8px 16px;font-size:0.85rem;font-weight:500;
  color:var(--text-secondary);border-radius:10px;cursor:pointer;
  transition:all 0.25s cubic-bezier(0.4,0,0.2,1);white-space:nowrap;
}
.lang-item.active{background:var(--primary-bg);color:var(--primary);font-weight:600}
.lang-item:hover:not(.active){color:var(--text)}
.segment-control{
  display:flex;background:var(--card-bg);border-radius:12px;padding:4px;
  box-shadow:var(--shadow);transition:background var(--transition),box-shadow var(--transition);user-select:none;
}
.segment-item{
  flex:1;text-align:center;padding:10px 16px;font-size:0.9rem;font-weight:500;
  color:var(--text-secondary);border-radius:10px;cursor:pointer;
  transition:all 0.25s cubic-bezier(0.4,0,0.2,1);white-space:nowrap;
}
.segment-item.active{background:var(--primary-bg);color:var(--primary);font-weight:600}
.segment-item:hover:not(.active){color:var(--text)}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat-card{
  background:var(--card-bg);border-radius:var(--radius-sm);padding:16px 12px;
  text-align:center;box-shadow:var(--shadow);transition:all var(--transition);
}
.stat-value{font-size:1.5rem;font-weight:700;letter-spacing:-0.5px;font-variant-numeric:tabular-nums}
.stat-value.time{color:var(--text)}
.stat-value.wpm{color:var(--primary)}
.stat-value.accuracy{color:var(--correct)}
.stat-value.progress{color:var(--text-secondary)}
.stat-label{font-size:0.75rem;color:var(--text-secondary);margin-top:4px;text-transform:uppercase;letter-spacing:0.5px;font-weight:500}
.progress-bar-wrap{height:6px;background:var(--border);border-radius:3px;overflow:hidden;transition:background var(--transition)}
.progress-bar-fill{height:100%;background:var(--primary);border-radius:3px;transition:width 0.2s ease;width:0%}
.typing-card{
  background:var(--card-bg);border-radius:var(--radius);padding:28px 24px;
  box-shadow:var(--shadow);transition:all var(--transition);min-height:160px;
  position:relative;cursor:text;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.typing-text{
  font-size:1.35rem;line-height:1.8;letter-spacing:0.3px;
  word-break:break-word;user-select:none;transition:color var(--transition);
  position:relative;z-index:2;pointer-events:none;
}
.char{position:relative;display:inline;transition:color 0.1s ease}
.char.correct{color:var(--correct)}
.char.error{color:var(--error);text-decoration:underline;text-decoration-color:var(--error);text-underline-offset:3px}
.char.current{
  background:var(--primary);color:#fff;border-radius:3px;padding:0 1px;
  animation:blink-caret 1s step-end infinite;
}
.char.pending{color:var(--text-tertiary)}
@keyframes blink-caret{0%,100%{opacity:1}50%{opacity:0.6}}

/* Invisible textarea: positioned over the card, fully transparent but interactive */
#hiddenInput{
  position:absolute;left:0;top:0;width:100%;height:100%;
  opacity:0;z-index:3;cursor:text;
  font-size:16px;line-height:1.8;padding:28px 24px;
  border:none;outline:none;resize:none;
  background:transparent;color:transparent;caret-color:transparent;
  -webkit-appearance:none;-webkit-user-select:text;user-select:text;
}
#hiddenInput::selection{background:transparent;color:transparent}

.translation-area{
  margin-top:16px;padding-top:14px;border-top:1px solid var(--border);
  font-size:0.9rem;color:var(--text-secondary);line-height:1.6;
  transition:all var(--transition);display:none;position:relative;z-index:2;pointer-events:none;
}
.translation-area.visible{display:block}
.translation-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-tertiary);margin-bottom:4px;font-weight:500}
.ime-hint{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  font-size:0.75rem;color:var(--primary);opacity:0;
  transition:opacity 0.2s ease;pointer-events:none;white-space:nowrap;z-index:2;
}
.ime-hint.visible{opacity:1}
.focus-hint{
  text-align:center;color:var(--text-tertiary);font-size:0.85rem;
  margin-top:12px;transition:opacity 0.3s ease;user-select:none;
  position:relative;z-index:2;pointer-events:none;
}

/* Virtual Keyboard */
.keyboard-wrap{transition:opacity 0.3s ease,max-height 0.3s ease;overflow:hidden}
.keyboard-wrap.hidden{opacity:0;max-height:0;margin:0;pointer-events:none}
.keyboard{display:flex;flex-direction:column;gap:6px;user-select:none}
.keyboard-row{display:flex;justify-content:center;gap:5px}
.key{
  background:var(--card-bg);border:1px solid var(--border);border-radius:8px;
  min-width:38px;height:44px;display:flex;align-items:center;justify-content:center;
  font-size:0.8rem;font-weight:500;color:var(--text);text-transform:uppercase;
  transition:all 0.08s ease;box-shadow:0 2px 0 rgba(0,0,0,0.06);
  cursor:default;position:relative;
}
.key.wide{min-width:56px}.key.wider{min-width:72px}.key.space-bar{min-width:260px}
.key.pressed{transform:translateY(2px);box-shadow:0 0 0 rgba(0,0,0,0)}
.key.hit-correct{background:var(--correct);border-color:var(--correct);color:#fff;box-shadow:0 0 12px rgba(52,199,89,0.5);transform:scale(0.95)}
.key.hit-error{background:var(--error);border-color:var(--error);color:#fff;box-shadow:0 0 12px rgba(255,59,48,0.5);animation:shake 0.3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

/* Overlay */
.overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:center;
  z-index:1000;opacity:0;pointer-events:none;transition:opacity 0.4s ease;
}
.overlay.show{opacity:1;pointer-events:all}
.overlay-bg{position:absolute;inset:0;background:rgba(0,0,0,0.35)}
.overlay-panel{
  position:relative;background:var(--overlay-bg);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:var(--radius);padding:40px 36px;max-width:420px;width:90%;
  text-align:center;box-shadow:var(--shadow-lg);border:1px solid var(--border);
  transform:translateY(20px) scale(0.95);
  transition:transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
}
.overlay.show .overlay-panel{transform:translateY(0) scale(1)}
.overlay-title{font-size:1.6rem;font-weight:700;margin-bottom:24px}
.overlay-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
.overlay-stat-val{font-size:2rem;font-weight:700;letter-spacing:-0.5px}
.overlay-stat-label{font-size:0.8rem;color:var(--text-secondary);margin-top:2px;text-transform:uppercase;font-weight:500}
.btn{
  display:inline-block;background:var(--primary);color:#fff;border:none;
  border-radius:25px;padding:12px 32px;font-size:1rem;font-weight:600;
  cursor:pointer;transition:all var(--transition);font-family:var(--font-stack);
}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,122,255,0.35)}
.btn:active{transform:scale(0.97)}
.btn-secondary{background:transparent;color:var(--primary);border:1.5px solid var(--primary);margin-left:10px}
.btn-secondary:hover{background:var(--primary-bg);box-shadow:none}
.best-record{font-size:0.8rem;color:var(--text-secondary);margin-top:12px;opacity:0.8}
.best-record span{color:var(--primary);font-weight:600}

@media(max-width:600px){
  body{padding:12px}
  .app-container{gap:12px}
  .logo{font-size:1.5rem}
  .stats-bar{grid-template-columns:repeat(2,1fr);gap:8px}
  .stat-card{padding:12px 8px}
  .stat-value{font-size:1.3rem}
  .typing-text{font-size:1.1rem}
  .key{min-width:26px;height:36px;font-size:0.65rem;border-radius:6px}
  .key.wide{min-width:40px}.key.wider{min-width:52px}.key.space-bar{min-width:140px}
  .keyboard-row{gap:3px}.keyboard{gap:4px}
  .overlay-panel{padding:28px 20px}.overlay-stats{gap:10px}.overlay-stat-val{font-size:1.5rem}
  .segment-item{padding:8px 10px;font-size:0.8rem}
  .lang-item{padding:6px 12px;font-size:0.78rem}
}
@media(max-width:400px){
  .key{min-width:22px;height:30px;font-size:0.55rem;border-radius:4px}
  .key.wide{min-width:32px}.key.wider{min-width:44px}.key.space-bar{min-width:100px}
  .keyboard-row{gap:2px}.keyboard{gap:3px}
}
</style>
</head>

<div class="app-container">

</div>

<div class="overlay" id="overlay">

      <div><div class="overlay-stat-val" id="finalAccuracy" style="color:var(--correct)">100%</div><div class="overlay-stat-label">准确率</div></div>
    </div>
    <div class="best-record" id="bestRecord"></div>
    <div style="margin-top:24px;">
      <button class="btn" id="retryBtn">再来一次</button>
      <button class="btn btn-secondary" id="changeModeBtn">切换模式</button>
    </div>
  </div>
</div>

/* ---------- KEYBOARD ---------- */

const KEYBOARD_ROWS=[
  ['`','1','2','3','4','5','6','7','8','9','0','-','=',{label:'⌫',wide:true}],
  [{label:'Tab',wider:true},'q','w','e','r','t','y','u','i','o','p','[',']','\\'],
  [{label:'Caps',wider:true},'a','s','d','f','g','h','j','k','l',';','\'',{label:'Enter',wide:true}],
  [{label:'Shift',wide:true},'z','x','c','v','b','n','m',',','.','/',{label:'Shift',wide:true}],
  [{label:' ',isSpace:true}]
];

function buildKeyboard(){
  const f=document.createDocumentFragment();
  KEYBOARD_ROWS.forEach(row=>{
    const rd=document.createElement('div');rd.className='keyboard-row';
    row.forEach(k=>{
      const kd=document.createElement('div');kd.className='key';
      if(typeof k==='string'){kd.dataset.key=k.toLowerCase();kd.textContent=k}
      else{if(k.wide)kd.classList.add('wide');if(k.wider)kd.classList.add('wider');if(k.isSpace)kd.classList.add('space-bar');kd.dataset.key=k.label===' '?' ':k.label.toLowerCase();kd.textContent=k.label}
      rd.appendChild(kd);
    });
    f.appendChild(rd);
  });
  dom.keyboard.innerHTML='';dom.keyboard.appendChild(f);
}

function getKeyboardKey(k){
  const m={Backspace:'⌫',Delete:'⌫',Tab:'tab',CapsLock:'caps',Enter:'enter',Shift:'shift',ShiftLeft:'shift',ShiftRight:'shift',' ':' '};
  return (m[k]!==undefined?m[k]:k).toLowerCase();
}

function highlightKey(key,type){
  if(state.lang==='zh')return;
  const n=getKeyboardKey(key);
  const el=dom.keyboard.querySelector(`[data-key="${CSS.escape(n)}"]`);
  if(!el)return;
  el.classList.remove('hit-correct','hit-error','pressed');void el.offsetWidth;
  el.classList.add('pressed');
  if(type==='correct')el.classList.add('hit-correct');
  if(type==='error')el.classList.add('hit-error');
  setTimeout(()=>el.classList.remove('hit-correct','hit-error','pressed'),200);
}

function updateKeyboardVisibility(){dom.keyboardWrap.classList.toggle('hidden',state.lang==='zh')}

/* ---------- CONTENT GENERATION ---------- */

function shuffleArray(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let currentTranslation='',currentWordList=[],wordBoundaries=[];

function generateEnWords(){
  const s=shuffleArray(EN_WORD_BANK);currentWordList=s.slice(0,20);
  const words=currentWordList.map(w=>w.en);const text=words.join(' ');
  wordBoundaries=[];let p=0;
  for(let i=0;i<words.length;i++){wordBoundaries.push([p,p+words[i].length]);p+=words[i].length+1}
  return text.split('');
}
function generateZhWords(){currentWordList=[];wordBoundaries=[];const s=shuffleArray(ZH_WORD_BANK);return s.slice(0,20).join('，').split('')}
function generateEnSentence(){const i=EN_SENTENCE_BANK[Math.floor(Math.random()*EN_SENTENCE_BANK.length)];currentTranslation=i.zh;return i.en.split('')}
function generateZhSentence(){currentTranslation='';return ZH_SENTENCE_BANK[Math.floor(Math.random()*ZH_SENTENCE_BANK.length)].split('')}
function generateEnPassage(){const i=EN_PASSAGE_BANK[Math.floor(Math.random()*EN_PASSAGE_BANK.length)];currentTranslation=i.zh;return i.text.split('')}
function generateZhPassage(){currentTranslation='';return ZH_PASSAGE_BANK[Math.floor(Math.random()*ZH_PASSAGE_BANK.length)].text.split('')}

function generateContent(){
  if(state.lang==='en'){switch(state.mode){case'words':return generateEnWords();case'sentences':return generateEnSentence();case'passages':return generateEnPassage();default:return generateEnWords()}}
  else{switch(state.mode){case'words':return generateZhWords();case'sentences':return generateZhSentence();case'passages':return generateZhPassage();default:return generateZhWords()}}
}

function renderTranslation(){
  const el=$('#translationArea');
  if(state.lang==='en'){
    if((state.mode==='sentences'||state.mode==='passages')&&currentTranslation){el.innerHTML=`<div class="translation-label">中文翻译</div>${currentTranslation}`;el.classList.add('visible');return}
    if(state.mode==='words'&&currentWordList.length>0){
      let wi=-1;
      for(let i=0;i<wordBoundaries.length;i++){const[s,e]=wordBoundaries[i];if(state.currentIndex>=s&&state.currentIndex<e){wi=i;break}}
      if(wi===-1){for(let i=0;i<wordBoundaries.length;i++){if(state.currentIndex<wordBoundaries[i][0]){wi=i;break}}}
      if(wi>=0&&wi<currentWordList.length){const w=currentWordList[wi];el.innerHTML=`<div class="translation-label">单词翻译</div><strong>${w.en}</strong> — ${w.zh}`;el.classList.add('visible');return}
    }
  }
  el.innerHTML='';el.classList.remove('visible');
}

/* ---------- RENDER ---------- */

function renderTypingText(){
  const chars=state.targetChars;let html='';
  for(let i=0;i<chars.length;i++){
    let ch=chars[i],cls='char pending',disp=ch;
    if(i<state.currentIndex)cls=state.errorPositions.has(i)?'char error':'char correct';
    else if(i===state.currentIndex)cls='char current';
    if(disp==='<')disp='&lt;';if(disp==='>')disp='&gt;';if(disp==='&')disp='&amp;';if(disp===' ')disp='&nbsp;';
    html+=`<span class="${cls}">${disp}</span>`;
  }
  dom.typingText.innerHTML=html;dom.typingText.className='typing-text';
  if(state.mode==='words')dom.typingText.classList.add('words-mode');
}

/* ---------- STATS ---------- */

function startTimer(){if(state.startTime)return;state.startTime=Date.now();state.timerInterval=setInterval(updateStats,200);dom.focusHint.style.opacity='0'}
function stopTimer(){if(state.timerInterval){clearInterval(state.timerInterval);state.timerInterval=null}updateStats()}

function updateStats(){
  const e=state.startTime?Math.floor((Date.now()-state.startTime)/1000):0;state.elapsedSeconds=e;
  const m=Math.floor(e/60),s=e%60;dom.timer.textContent=m>0?`${m}m ${s}s`:`${s}s`;
  const cc=state.currentIndex-state.errorCount,min=Math.max(e/60,0.01);
  if(state.lang==='en'){dom.wpm.textContent=Math.max(0,Math.round((cc/5)/min));dom.speedLabel.textContent='WPM'}
  else{dom.wpm.textContent=Math.max(0,Math.round(cc/min));dom.speedLabel.textContent='CPM'}
  const tt=state.totalTyped,acc=tt>0?Math.round(((tt-state.errors)/tt)*100):100;dom.accuracy.textContent=acc+'%';
  const tot=state.targetChars.length,prog=tot>0?Math.round((state.currentIndex/tot)*100):0;
  dom.progressPct.textContent=prog+'%';dom.progressBar.style.width=prog+'%';
}

/* ---------- RESULT ---------- */

function getBestKey(){return`typeflow_best_${state.lang==='en'?'wpm':'cpm'}`}
function getBest(){try{return parseInt(localStorage.getItem(getBestKey())||'0',10)}catch{return 0}}
function saveBest(v){try{const b=getBest();if(v>b){localStorage.setItem(getBestKey(),v.toString());return true}return false}catch{return false}}

function showResult(){
  stopTimer();state.finished=true;clearTextarea();
  const e=state.elapsedSeconds,m=Math.floor(e/60),s=e%60,ts=m>0?`${m}m ${s}s`:`${s}s`;
  const cc=state.currentIndex-state.errorCount,min=Math.max(e/60,0.01);
  let fs;if(state.lang==='en'){fs=Math.round((cc/5)/min);dom.finalSpeedLabel.textContent='WPM'}else{fs=Math.round(cc/min);dom.finalSpeedLabel.textContent='CPM'}
  fs=Math.max(0,fs);
  const tt=state.totalTyped,acc=tt>0?Math.round(((tt-state.errors)/tt)*100):100;
  dom.finalTime.textContent=ts;dom.finalWpm.textContent=fs;dom.finalAccuracy.textContent=acc+'%';
  animateNumber(dom.finalWpm,fs);animateNumber(dom.finalAccuracy,acc,'%');
  const isNew=saveBest(fs),cur=getBest(),label=state.lang==='en'?'WPM':'CPM';
  if(isNew)dom.bestRecord.innerHTML=`🏆 <span>新纪录！</span>最高 ${label}: ${cur}`;
  else if(cur>0)dom.bestRecord.innerHTML=`历史最高 ${label}: <span>${cur}</span>`;
  else dom.bestRecord.innerHTML='';
  dom.overlay.classList.add('show');
}
function hideResult(){dom.overlay.classList.remove('show')}

function animateNumber(el,target,suffix=''){
  const start=parseInt(el.textContent,10)||0,dur=600,st=performance.now();
  function step(now){const e=now-st,p=Math.min(e/dur,1),ed=1-Math.pow(1-p,3);el.textContent=Math.round(start+(target-start)*ed)+suffix;if(p<1)requestAnimationFrame(step)}
  requestAnimationFrame(step);
}

/* ---------- INPUT HANDLING ---------- */

let prevTextareaValue='';
function clearTextarea(){dom.hiddenInput.value='';prevTextareaValue=''}

function handleTextareaInput(){
  if(state.finished)return;
  const nv=dom.hiddenInput.value,ov=prevTextareaValue;
  // During IME composition (ZH mode), wait for compositionend to process the committed text.
  // Do NOT consume the composing preview here.
  if(state.isComposing&&state.lang==='zh')return;
  // Detect backspace
  if(nv.length<ov.length){const d=ov.length-nv.length;for(let i=0;i<d;i++)handleBackspace();prevTextareaValue=nv;return}
  // Detect new characters
  if(nv.length>ov.length){
    const added=nv.slice(ov.length);
    if(nv.startsWith(ov)){if(!state.startTime)startTimer();for(const c of added){if(state.finished)break;processCharInput(c)}}
    else{const cl=commonPrefix(ov,nv);for(let i=0;i<ov.length-cl;i++)handleBackspace();if(!state.startTime)startTimer();for(const c of nv.slice(cl)){if(state.finished)break;processCharInput(c)}}
    prevTextareaValue=nv;
  }
}
function commonPrefix(a,b){let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;return i}

function processCharInput(char){
  const t=state.targetChars[state.currentIndex];state.totalTyped++;
  if(char===t)state.currentIndex++;
  else{state.errors++;state.errorCount++;state.errorPositions.add(state.currentIndex);state.currentIndex++}
  renderTypingText();renderTranslation();updateStats();
  if(state.currentIndex>=state.targetChars.length)showResult();
}
function handleBackspace(){
  if(state.currentIndex<=0)return;state.currentIndex--;state.totalTyped=Math.max(0,state.totalTyped-1);
  if(state.errorPositions.has(state.currentIndex)){state.errorPositions.delete(state.currentIndex);state.errorCount=Math.max(0,state.errorCount-1);state.errors=Math.max(0,state.errors-1)}
  renderTypingText();renderTranslation();updateStats();
}

/* ---------- KEYDOWN for virtual keyboard highlight ---------- */

function handleKeydown(e){
  if(state.finished||state.lang!=='en')return;
  const k=e.key;
  if(['Shift','Control','Alt','Meta','CapsLock','Tab','Escape'].includes(k))return;
  if(k.startsWith('F')&&k.length<=3&&!isNaN(k.slice(1)))return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','End','PageUp','PageDown'].includes(k))return;
  if(k==='Backspace'||k==='Delete'){highlightKey('Backspace','');return}
  if(k.length!==1)return;
  const t=state.targetChars[state.currentIndex];
  highlightKey(k,k===t?'correct':'error');
}

/* ---------- IME COMPOSITION ---------- */

function handleCompositionStart(){
  // Only track composition in Chinese mode; EN mode handles chars via input events
  if(state.finished||state.lang!=='zh')return;
  state.isComposing=true;dom.imeHint.classList.add('visible');
}

function handleCompositionUpdate(){
  // Preview only: the composing text (e.g. pinyin) must NOT be consumed.
  // prevTextareaValue keeps the pre-composition value so the commit diff is exact.
}

function handleCompositionEnd(e){
  state.isComposing=false;dom.imeHint.classList.remove('visible');
  if(state.finished)return;
  if(state.lang!=='zh'){
    // EN mode: characters arrive via input events; just resync the baseline
    prevTextareaValue=dom.hiddenInput.value;
    return;
  }
  const ov=prevTextareaValue;
  const committed=(e&&typeof e.data==='string')?e.data:null;
  let nv;
  if(committed!==null){
    // Chrome commits the textarea value AFTER compositionend, Firefox BEFORE it.
    // Processing e.data here covers both orders: any input event that follows
    // will match prevTextareaValue and become a no-op.
    if(committed.length>0){
      if(!state.startTime)startTimer();
      for(const c of committed){if(state.finished)break;processCharInput(c)}
    }
    nv=ov+committed;
  }else{
    // No data available: fall back to diffing the textarea value
    nv=dom.hiddenInput.value;
    if(nv!==ov){
      if(nv.length>ov.length&&nv.startsWith(ov)){if(!state.startTime)startTimer();for(const c of nv.slice(ov.length)){if(state.finished)break;processCharInput(c)}}
      else if(nv.length<ov.length){for(let i=0;i<ov.length-nv.length;i++)handleBackspace()}
      else{const cl=commonPrefix(ov,nv);for(let i=0;i<ov.length-cl;i++)handleBackspace();if(!state.startTime)startTimer();for(const c of nv.slice(cl)){if(state.finished)break;processCharInput(c)}}
    }
  }
  prevTextareaValue=nv;
}

/* ---------- INIT / RESET ---------- */

function resetState(){
  stopTimer();state.targetChars=generateContent();state.currentIndex=0;
  state.totalTyped=0;state.errors=0;state.errorCount=0;state.errorPositions=new Set();
  state.startTime=null;state.elapsedSeconds=0;state.finished=false;state.isComposing=false;
  dom.imeHint.classList.remove('visible');clearTextarea();
}
function resetUI(){
  dom.timer.textContent='0s';dom.wpm.textContent='0';dom.speedLabel.textContent=state.lang==='en'?'WPM':'CPM';
  dom.accuracy.textContent='100%';dom.progressPct.textContent='0%';dom.progressBar.style.width='0%';
  dom.focusHint.style.opacity='1';renderTypingText();renderTranslation();hideResult();updateKeyboardVisibility();
}
function initExercise(){resetState();resetUI();dom.hiddenInput.focus()}

/* ---------- SWITCHING ---------- */

function switchMode(mode){if(state.mode===mode)return;state.mode=mode;$$('.segment-item').forEach(e=>e.classList.toggle('active',e.dataset.mode===mode));initExercise()}

function switchLang(lang){
  if(state.lang===lang)return;
  state.lang=lang;
  $$('.lang-item').forEach(e=>e.classList.toggle('active',e.dataset.lang===lang));
  // Update textarea lang attribute for mobile keyboard
  dom.hiddenInput.setAttribute('lang',lang==='zh'?'zh-CN':'en');
  updateKeyboardVisibility();initExercise();
}

/* ---------- DARK MODE ---------- */

function toggleDarkMode(){
  state.darkMode=!state.darkMode;document.documentElement.classList.toggle('dark',state.darkMode);
  dom.darkToggle.textContent=state.darkMode?'☀️':'🌙';
  try{localStorage.setItem('typeflow_dark_mode',state.darkMode?'1':'0')}catch{}
}
function loadDarkMode(){
  try{if(localStorage.getItem('typeflow_dark_mode')==='1'){state.darkMode=true;document.documentElement.classList.add('dark');dom.darkToggle.textContent='☀️'}}catch{}
}

/* ---------- EVENTS ---------- */

function bindEvents(){
  dom.hiddenInput.addEventListener('input',handleTextareaInput);
  dom.hiddenInput.addEventListener('compositionstart',handleCompositionStart);
  dom.hiddenInput.addEventListener('compositionupdate',handleCompositionUpdate);
  dom.hiddenInput.addEventListener('compositionend',handleCompositionEnd);
  dom.hiddenInput.addEventListener('keydown',handleKeydown);
  dom.hiddenInput.addEventListener('blur',()=>{setTimeout(()=>{if(!state.finished)dom.hiddenInput.focus()},100)});

  const card=dom.typingText.parentElement;
  card.addEventListener('click',e=>{e.preventDefault();dom.hiddenInput.focus()});
  card.addEventListener('touchstart',()=>{setTimeout(()=>{if(!state.finished)dom.hiddenInput.focus()},50)},{passive:true});

  dom.langToggle.addEventListener('click',e=>{const i=e.target.closest('.lang-item');if(i&&i.dataset.lang)switchLang(i.dataset.lang)});
  dom.segmentControl.addEventListener('click',e=>{const i=e.target.closest('.segment-item');if(i&&i.dataset.mode)switchMode(i.dataset.mode)});
  dom.darkToggle.addEventListener('click',toggleDarkMode);
  dom.retryBtn.addEventListener('click',()=>{hideResult();initExercise()});
  dom.changeModeBtn.addEventListener('click',()=>{hideResult();const m=['words','sentences','passages'];switchMode(m[(m.indexOf(state.mode)+1)%m.length])});
  dom.overlayBg.addEventListener('click',hideResult);
  document.addEventListener('click',e=>{
    if(state.finished)return;if(e.target.closest('#overlay'))return;
    if(e.target.closest('.lang-toggle')||e.target.closest('.segment-control')||e.target.closest('.dark-toggle'))return;
    if(document.activeElement!==dom.hiddenInput)dom.hiddenInput.focus();
  });
}

/* ---------- INIT ---------- */

function init(){buildKeyboard();updateKeyboardVisibility();loadDarkMode();bindEvents();initExercise()}
document.addEventListener('DOMContentLoaded',init);
</script>
